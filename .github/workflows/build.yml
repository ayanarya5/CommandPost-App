name: Build CommandPost Latest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout CommandPost-App
        uses: actions/checkout@v4
        with:
          repository: CommandPost/CommandPost-App
          path: CommandPost-App

      - name: Checkout CommandPost Lua source
        uses: actions/checkout@v4
        with:
          repository: CommandPost/CommandPost
          ref: develop
          path: CommandPost

      - name: Checkout Workflow Extensions SDK
        uses: actions/checkout@v4
        with:
          repository: ayanarya5/CommandPost-App
          sparse-checkout: WorkflowExtensionsSDK.dmg
          path: SDK

      - name: Align Dependency Paths
        run: |
          mkdir -p CommandPost-App/CommandPost
          cp -R CommandPost/* CommandPost-App/CommandPost/

      - name: Remove LateNite App Requirement
        working-directory: CommandPost-App
        run: |
          echo "Searching for LateNite requirement..."

          grep -R "Please download and install a LateNite App" CommandPost || true

          grep -rl "Please download and install a LateNite App" CommandPost | while read file; do
            echo "Removing LateNite requirement from:"
            echo "$file"
            sed -i '' '/Please download and install a LateNite App/d' "$file"
          done

      - name: Install Workflow Extensions SDK
        run: |
          hdiutil attach SDK/WorkflowExtensionsSDK.dmg -nobrowse

          sudo installer \
            -pkg /Volumes/WorkflowExtensionsSDK/*.pkg \
            -target /

          hdiutil detach /Volumes/WorkflowExtensionsSDK

      - name: Remove unsupported warning flags
        working-directory: CommandPost-App
        run: |
          grep -rl -- "-Wno-implicit-void-ptr-cast" . | xargs -I{} sed -i '' 's/-Wno-implicit-void-ptr-cast//g' {} || true
          grep -rl -- "-Wno-jump-misses-init" . | xargs -I{} sed -i '' 's/-Wno-jump-misses-init//g' {} || true
          grep -rl -- "-Wno-implicit-int-enum-cast" . | xargs -I{} sed -i '' 's/-Wno-implicit-int-enum-cast//g' {} || true

      - name: List schemes to summary
        working-directory: CommandPost-App
        run: |
          echo "## Available schemes" >> $GITHUB_STEP_SUMMARY
          xcodebuild -list -workspace Hammerspoon.xcworkspace >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Compile
        id: compile
        working-directory: CommandPost-App
        run: |
          set -o pipefail

          xcodebuild \
            -workspace Hammerspoon.xcworkspace \
            -scheme "Hammerspoon" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build.log

      - name: Show real errors
        if: always()
        working-directory: CommandPost-App
        run: |
          echo "## Real compiler errors" >> $GITHUB_STEP_SUMMARY
          grep -E ": error:" build.log | sort -u >> $GITHUB_STEP_SUMMARY || echo "No 'error:' lines found in build.log" >> $GITHUB_STEP_SUMMARY

      - name: Package DMG
        run: |
          set -e

          mkdir -p dist

          echo "Searching for built application..."

          APP=$(find CommandPost-App/build -name "*.app" -type d | grep -v "Updater.app" | head -1)

          if [ -z "$APP" ]; then
            echo "No built app found"
            find CommandPost-App/build -name "*.app"
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          APP_NAME=$(basename "$APP")

          cp -R "$APP" dist/

          echo "App size:"
          du -sh "dist/$APP_NAME"

          hdiutil create \
            -format UDZO \
            -srcfolder dist/ \
            CommandPost_Latest.dmg

          echo "DMG size:"
          ls -lh CommandPost_Latest.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CommandPost-Latest
          path: CommandPost_Latest.dmg
